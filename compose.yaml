x-app: &app
  image: kamelog-app:current
  environment:
    KAMELOG_ORIGIN: ${KAMELOG_ORIGIN:?Set the public HTTPS origin}
    KAMELOG_BOOTSTRAP_TOKEN: ${KAMELOG_BOOTSTRAP_TOKEN:-}
  volumes: ["kamelog-data:/data"]
  init: true
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  mem_limit: 1g
  pids_limit: 128
  stop_grace_period: 30s
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 5s
    start_period: 20s
    retries: 12
services:
  app-blue:
    <<: *app
    build: .
  app-green:
    <<: *app
  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["./ops/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      app-blue: { condition: service_healthy }
      app-green: { condition: service_healthy }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run"]
    mem_limit: 128m
    pids_limit: 64
volumes:
  kamelog-data:
