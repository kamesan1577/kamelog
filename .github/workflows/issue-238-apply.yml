name: Apply issue 238 integration
on:
  push:
    branches:
      - feat/issue-238-timeline-ux
    paths:
      - .github/workflows/issue-238-apply.yml
      - scripts/apply-issue-238.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-238-timeline-ux
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Apply verified notebook edits
        run: python3 scripts/apply-issue-238.py
      - run: npm ci
      - name: Format affected files
        run: npx prettier --write app/notebook.tsx components/timeline-gestures.ts components/design-system/patterns/TimelineToolbar.tsx components/design-system/patterns/TimelineToolbar.css components/design-system/patterns/InlineComposer.css tests/e2e/timeline-gestures.spec.ts adr/issue-238-timeline-gestures.md
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/notebook.tsx components/timeline-gestures.ts components/design-system/patterns/TimelineToolbar.tsx components/design-system/patterns/TimelineToolbar.css components/design-system/patterns/InlineComposer.css tests/e2e/timeline-gestures.spec.ts adr/issue-238-timeline-gestures.md
          if ! git diff --cached --quiet; then
            git commit -m "Implement issue 238 timeline behavior"
            git push origin HEAD:feat/issue-238-timeline-ux
          fi
