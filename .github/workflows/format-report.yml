name: Format report

on:
  push:
    branches:
      - fix/issues-77-78-session-tweet-threads

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print Prettier diff
        run: |
          npx prettier --write \
            app/tweet-thread-bridge.tsx \
            tests/e2e/tweet-thread.spec.ts \
            tests/server/session-lifetime.test.mjs \
            tests/server/tweet-thread.test.mjs
          git diff -- \
            app/tweet-thread-bridge.tsx \
            tests/e2e/tweet-thread.spec.ts \
            tests/server/session-lifetime.test.mjs \
            tests/server/tweet-thread.test.mjs
